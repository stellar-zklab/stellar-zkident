[workspace]
resolver = "2"
members = [
    "contracts/did_registry",
    "contracts/credential_verifier",
    "contracts/reputation_nft",
    "contracts/asp_registry",
]

[workspace.dependencies]
soroban-sdk = { version = "22.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
